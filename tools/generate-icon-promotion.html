<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전직 컨셉 아이콘</title>
<style>
  body { margin: 24px; background: #1a1a1a; color: #ddd; font-family: -apple-system, "Segoe UI", sans-serif; }
  h1 { margin-top: 0; }
  .asset { margin-bottom: 36px; padding: 16px; background: #252525; border-radius: 8px; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  canvas { display: block; background: #000; margin: 12px 0; max-width: 100%; height: auto; }
  button { padding: 8px 16px; background: #3498db; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; }
  button:hover { background: #2980b9; }
  .spec { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <h1>전직 컨셉 앱 아이콘</h1>

  <div class="asset">
    <h2>전직 아이콘 (512 × 512)</h2>
    <div class="spec">기본 타워 → 빛기둥 → 진화 타워. 황금 톤으로 "레벨 업" 느낌</div>
    <canvas id="icon" width="512" height="512"></canvas>
    <button onclick="download('icon', 'icon-promotion-512.png', 'image/png')">PNG 다운로드</button>
    <button onclick="download('iconHi', 'icon-promotion-1024.png', 'image/png')">1024 다운로드 (capacitor-assets용)</button>
  </div>

  <div class="asset" style="display: none;">
    <canvas id="iconHi" width="1024" height="1024"></canvas>
  </div>

<script>
function download(id, filename, mime, quality) {
  const canvas = document.getElementById(id);
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }, mime, quality);
}

function drawPromotionIcon(ctx, scale) {
  ctx.save();
  ctx.scale(scale, scale);

  const S = 512;
  const cx = S / 2;

  // 배경 — 어두운 녹색 방사형 그라데이션 (중심부 살짝 밝게)
  const bg = ctx.createRadialGradient(cx, 280, 60, cx, 280, S * 0.75);
  bg.addColorStop(0, '#2d4a2b');
  bg.addColorStop(1, '#0e1a0e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, S, S);

  // 미세한 노이즈 대신 별빛 점 (배경 깊이감)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  const sparkles = [
    [90, 90, 2], [430, 60, 2], [60, 250, 1.5], [450, 200, 2],
    [80, 430, 1.5], [440, 460, 2], [200, 30, 1.5], [340, 470, 1.8],
  ];
  for (const [x, y, r] of sparkles) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ============ 하단 — 이전 타워 (반투명 기본 타워) ============
  const baseY = 410;
  const baseR = 36;
  ctx.globalAlpha = 0.38;
  ctx.fillStyle = '#3498db';
  ctx.beginPath();
  ctx.arc(cx, baseY, baseR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a5680';
  ctx.lineWidth = 5;
  ctx.stroke();
  // 배럴 (위쪽 향함)
  ctx.fillStyle = '#1a5680';
  ctx.fillRect(cx - 9, baseY - 48, 18, 18);
  ctx.globalAlpha = 1;

  // ============ 중앙 — 황금 빛기둥 (사다리꼴 형태로 위로 갈수록 좁아짐) ============
  const beamTopY = 175;
  const beamBottomY = baseY - 20;
  // 외곽 글로우
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#f4d03f';
  ctx.beginPath();
  ctx.moveTo(cx - 65, beamBottomY);
  ctx.lineTo(cx - 28, beamTopY);
  ctx.lineTo(cx + 28, beamTopY);
  ctx.lineTo(cx + 65, beamBottomY);
  ctx.closePath();
  ctx.fill();
  // 중간 레이어
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(cx - 42, beamBottomY);
  ctx.lineTo(cx - 18, beamTopY);
  ctx.lineTo(cx + 18, beamTopY);
  ctx.lineTo(cx + 42, beamBottomY);
  ctx.closePath();
  ctx.fill();
  // 내부 화이트 코어
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = '#fff7d6';
  ctx.beginPath();
  ctx.moveTo(cx - 22, beamBottomY);
  ctx.lineTo(cx - 9, beamTopY);
  ctx.lineTo(cx + 9, beamTopY);
  ctx.lineTo(cx + 22, beamBottomY);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // 빛기둥 안쪽 상승 화살표 셰브론 (3개, 위로 갈수록 작아짐)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const chevrons = [
    { y: 350, w: 18 },
    { y: 290, w: 14 },
    { y: 230, w: 11 },
  ];
  for (const c of chevrons) {
    ctx.beginPath();
    ctx.moveTo(cx - c.w, c.y + 8);
    ctx.lineTo(cx, c.y - 8);
    ctx.lineTo(cx + c.w, c.y + 8);
    ctx.stroke();
  }

  // ============ 상단 — 진화 타워 (황금 육각형) ============
  const upperY = 160;
  const upperR = 78;

  // 외곽 펄스링 (전직 강조)
  ctx.strokeStyle = '#f4d03f';
  ctx.lineWidth = 5;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.arc(cx, upperY, upperR + 22, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, upperY, upperR + 38, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 육각형 본체
  ctx.fillStyle = '#f4d03f';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 - Math.PI / 2;
    const px = cx + upperR * Math.cos(a);
    const py = upperY + upperR * Math.sin(a);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#9a7d0a';
  ctx.lineWidth = 9;
  ctx.stroke();

  // 흰색 발광 코어
  const coreR = upperR * 0.45;
  const coreGrad = ctx.createRadialGradient(cx, upperY, 0, cx, upperY, coreR);
  coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
  coreGrad.addColorStop(0.6, 'rgba(255, 247, 214, 0.9)');
  coreGrad.addColorStop(1, 'rgba(255, 247, 214, 0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, upperY, coreR, 0, Math.PI * 2);
  ctx.fill();

  // ============ 별 스파클 (전직 순간 강조) ============
  function star(x, y, r, color) {
    ctx.fillStyle = color || '#fff';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 - Math.PI / 2;
      const len = (i % 2 === 0) ? r : r * 0.4;
      const px = x + len * Math.cos(a);
      const py = y + len * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // 상단 타워 주변 4개 + 빛기둥 측면 1개씩
  star(cx - 140, upperY + 20, 10, '#fff');
  star(cx + 140, upperY + 20, 10, '#fff');
  star(cx - 105, upperY - 70, 7, '#fff7d6');
  star(cx + 110, upperY - 60, 8, '#fff7d6');
  star(cx, upperY - 130, 6, '#fff');
  star(cx - 85, baseY - 30, 5, '#fff7d6');
  star(cx + 85, baseY - 30, 5, '#fff7d6');

  ctx.restore();
}

drawPromotionIcon(document.getElementById('icon').getContext('2d'), 1);
drawPromotionIcon(document.getElementById('iconHi').getContext('2d'), 2);
</script>
</body>
</html>
